services:
  - type: web
    name: balancevault-backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health/liveness
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.vercel.app,http://localhost:5173,http://localhost:3000"
      - key: SERVER_PORT
        value: 8080

databases:
  - name: balancevault-postgres
    databaseName: ledgerline
    user: postgres
    plan: free
    region: oregon
