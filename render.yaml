services:
  # 1. Backend Web Service (Spring Boot 3 + Java 21)
  - type: web
    name: balancevault-backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health/liveness
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.onrender.com,https://*.vercel.app,http://localhost:5173,http://localhost:3000"
      - key: SERVER_PORT
        value: 8080

  # 2. Frontend Static Site (React + Vite SPA)
  - type: web
    name: balancevault-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: balancevault-backend
          property: host
